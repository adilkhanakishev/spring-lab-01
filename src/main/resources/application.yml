spring:
  application:
    name: spring-lab

server:
  port: 8080

app:
  owner: Akishev Adilkhan
  group: IS-2406
  date-pattern: yyyy-MM-dd HH:mm:ss
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  pagination:
    default-size: 20
    max-size: 100
  slow-threshold: 200

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
